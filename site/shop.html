<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Keyima — Ichiban Kuji ของแท้จากญี่ปุ่น</title>
<style>
:root{
  --bg:#f7f5f8;--surface:#fff;--ink:#1a1523;--ink2:#6b6577;--muted:#a8a2b2;--line:#eee9f0;
  --accent:#e5397e;--accent2:#ff5c9d;--accentsoft:#ffe8f1;--line-green:#06c755;
  --shadow:0 1px 2px rgba(26,21,35,.04),0 6px 20px rgba(26,21,35,.06);
  --shadowlg:0 18px 50px rgba(26,21,35,.22);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
img{display:block}a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer}
/* ===== top bar ===== */
.top{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:1200px;margin:0 auto;padding:11px 18px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;font-weight:900;box-shadow:0 5px 14px rgba(229,57,126,.4)}
.brand .bt{line-height:1.05}
.brand .bt b{font-size:18px;font-weight:900;letter-spacing:-.4px;display:block}
.brand .bt span{font-size:9.5px;font-weight:800;letter-spacing:2.5px;color:var(--muted)}
.searchw{flex:1;position:relative;max-width:560px;margin:0 auto}
.searchw input{width:100%;font-family:inherit;font-size:14px;padding:11px 14px 11px 40px;border:1px solid var(--line);border-radius:13px;background:#faf9fb;color:var(--ink)}
.searchw input:focus{outline:none;border-color:var(--accent);background:#fff}
.searchw::before{content:"🔍";position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.5}
.cartbtn{position:relative;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:19px;display:flex;align-items:center;justify-content:center;flex:none}
.cartbtn .n{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--accent);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(229,57,126,.4)}
.linebtn{display:inline-flex;align-items:center;gap:7px;background:var(--line-green);color:#fff;font-weight:800;font-size:13.5px;padding:11px 16px;border-radius:12px;box-shadow:0 4px 12px rgba(6,199,85,.3);flex:none}
.linebtn:hover{filter:brightness(1.05)}
/* ===== hero ===== */
.hero{max-width:1200px;margin:0 auto;padding:24px 18px 4px}
.hero h1{font-size:26px;font-weight:900;letter-spacing:-.5px}
.hero p{color:var(--ink2);font-size:14px;margin-top:6px}
.hero .meta{margin-top:12px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.tag{font-size:12.5px;font-weight:800;color:var(--accent);background:var(--accentsoft);border-radius:999px;padding:6px 13px}
.tag.g{color:var(--ink2);background:#fff;border:1px solid var(--line);font-weight:700}
/* ===== bar ===== */
.bar{max-width:1200px;margin:16px auto 0;padding:0 18px;display:flex;gap:10px;align-items:center}
.bar .cnt{font-weight:800;font-size:14px}
.bar .right{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;font-weight:700}
.bar select{font-family:inherit;font-size:13px;font-weight:700;padding:9px 12px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink)}
/* ===== grid ===== */
.wrap{max-width:1200px;margin:16px auto 80px;padding:0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:.17s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(26,21,35,.14)}
.cov{position:relative;aspect-ratio:4/3;overflow:hidden;display:flex;align-items:flex-end;padding:14px}
.cov img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:.35s}
.card:hover .cov img{transform:scale(1.05)}
.cov .wm{position:absolute;top:13px;left:14px;font-size:10px;font-weight:900;letter-spacing:2px;color:rgba(255,255,255,.85);text-shadow:0 1px 4px rgba(0,0,0,.3);z-index:2}
.cov .bdg{position:absolute;top:11px;right:11px;z-index:2;font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.bdg.pre{background:#fff;color:var(--ink)}.bdg.ready{background:var(--line-green);color:#fff}
.cov .cvname{position:relative;z-index:2;font-size:19px;font-weight:900;color:#fff;line-height:1.15;text-shadow:0 2px 8px rgba(0,0,0,.4);letter-spacing:-.3px}
.cov::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.45));z-index:1}
.cbody{padding:13px 14px 15px;display:flex;flex-direction:column;gap:8px;flex:1}
.cname{font-size:13.5px;font-weight:800;line-height:1.35}
.csub{font-size:12px;color:var(--ink2);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:33px}
.crow{margin-top:auto;display:flex;align-items:center;justify-content:space-between}
.pill{font-size:11.5px;font-weight:800;color:var(--accent);background:var(--accentsoft);border-radius:999px;padding:4px 11px}
.pr{text-align:right}.pr .l{font-size:10.5px;color:var(--muted);font-weight:700}.pr .v{font-size:18px;font-weight:900;color:var(--accent);letter-spacing:-.3px}
/* ===== modal ===== */
.ov{position:fixed;inset:0;background:rgba(26,21,35,.5);backdrop-filter:blur(3px);display:none;z-index:100}
.ov.show{display:block}
.sheet{position:fixed;left:50%;top:26px;transform:translateX(-50%);width:calc(100% - 24px);max-width:920px;max-height:calc(100vh - 52px);overflow:auto;background:var(--bg);border-radius:22px;box-shadow:var(--shadowlg);z-index:101;display:none}
.sheet.show{display:block}
.x{position:absolute;right:14px;top:14px;width:38px;height:38px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:16px;color:var(--ink2);z-index:3;box-shadow:var(--shadow)}
.mhead{display:flex;gap:16px;align-items:center;padding:20px 22px;background:#fff;border-bottom:1px solid var(--line);border-radius:22px 22px 0 0}
.mhead .mh-cov{width:100px;height:100px;border-radius:16px;object-fit:cover;flex:none;border:1px solid var(--line);background:#f2eef3}
.mhead h2{font-size:18px;font-weight:900;line-height:1.25}
.mhead .sub{font-size:12.5px;color:var(--ink2);margin-top:6px}
.mbody{padding:18px 22px 24px}
.mt{font-size:13px;font-weight:800;color:var(--ink2);margin-bottom:13px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:14px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.pcard .pimg{aspect-ratio:1/1;background:#f2eef3;position:relative;overflow:hidden}
.pcard .pimg img{width:100%;height:100%;object-fit:cover}
.pb{position:absolute;top:8px;left:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:11.5px;font-weight:900;padding:3px 10px;border-radius:999px;box-shadow:0 2px 8px rgba(229,57,126,.4)}
.soldout{position:absolute;inset:0;background:rgba(255,255,255,.72);display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--ink2);font-size:14px}
.pcbody{padding:11px 12px 13px;display:flex;flex-direction:column;gap:9px;flex:1}
.pchar{font-size:12.5px;font-weight:700;min-height:18px}
.pprice{display:flex;align-items:baseline;gap:5px}
.pprice .v{font-size:19px;font-weight:900;color:var(--accent);letter-spacing:-.3px}.pprice .u{font-size:11px;color:var(--muted);font-weight:700}
.qadd{margin-top:auto;display:flex;align-items:center;gap:7px}
.stp{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.stp button{width:30px;height:34px;border:none;background:#fff;font-size:16px;font-weight:800;color:var(--ink2)}
.stp button:active{background:var(--accentsoft)}
.stp span{width:30px;text-align:center;font-weight:800;font-size:13px}
.addb{flex:1;height:36px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-weight:800;font-size:12.5px;display:flex;align-items:center;justify-content:center;gap:5px}
.addb:hover{filter:brightness(1.05)}.addb.dim{background:#e6e2ea;color:var(--muted)}
/* ===== cart drawer ===== */
.drawer{position:fixed;right:0;top:0;height:100%;width:400px;max-width:92vw;background:#fff;box-shadow:var(--shadowlg);z-index:101;display:flex;flex-direction:column;transform:translateX(105%);transition:.24s}
.drawer.show{transform:translateX(0)}
.dh{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.dh b{font-size:17px;font-weight:900}
.dclose{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:15px}
.ditems{flex:1;overflow:auto;padding:12px 16px}
.ci{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.ci img{width:56px;height:56px;border-radius:12px;object-fit:cover;background:#f2eef3;flex:none}
.ci .cinfo{flex:1;min-width:0}
.ci .cn{font-size:12.5px;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ci .cp{font-size:13px;font-weight:900;color:var(--accent);margin-top:3px}
.ci .cctl{display:flex;align-items:center;gap:8px;margin-top:6px}
.ci .rm{margin-left:auto;color:var(--muted);font-size:12px;font-weight:700;background:none;border:none}
.dempty{text-align:center;color:var(--muted);padding:60px 20px;font-weight:600}
.dfoot{border-top:1px solid var(--line);padding:16px 20px}
.dtot{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.dtot b{font-size:22px;font-weight:900;color:var(--accent)}
.cob{width:100%;height:50px;border:none;border-radius:14px;background:var(--accent);color:#fff;font-weight:900;font-size:15px}
.cob:hover{filter:brightness(1.05)}
/* checkout / success */
.form label{display:block;font-size:12.5px;font-weight:800;color:var(--ink2);margin:12px 0 5px}
.form input,.form textarea{width:100%;font-family:inherit;font-size:14px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:#faf9fb}
.form input:focus,.form textarea:focus{outline:none;border-color:var(--accent);background:#fff}
.form textarea{height:70px;resize:vertical}
.success{text-align:center;padding:24px 8px}
.success .ok{width:70px;height:70px;border-radius:50%;background:var(--line-green);color:#fff;font-size:36px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;box-shadow:0 8px 20px rgba(6,199,85,.35)}
.success h3{font-size:20px;font-weight:900}
.ordno{display:inline-block;margin:12px 0;font-size:17px;font-weight:900;color:var(--accent);background:var(--accentsoft);border-radius:12px;padding:8px 18px;letter-spacing:.5px}
.floatline{position:fixed;right:18px;bottom:18px;z-index:60;background:var(--line-green);color:#fff;font-weight:800;font-size:14px;padding:13px 20px;border-radius:999px;box-shadow:0 8px 24px rgba(6,199,85,.45);display:flex;align-items:center;gap:8px}
.empty{background:#fff;border:1px dashed var(--line);border-radius:20px;padding:56px 22px;text-align:center;color:var(--ink2)}
.foot{max-width:1200px;margin:0 auto;padding:26px 18px 90px;color:var(--muted);font-size:12px;border-top:1px solid var(--line);text-align:center}
#toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(10px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;font-size:13.5px;font-weight:700;opacity:0;transition:.22s;pointer-events:none;z-index:300;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:640px){.searchw{order:3;max-width:none;flex-basis:100%;margin-top:4px}.top-in{flex-wrap:wrap}.hero h1{font-size:21px}.mhead{flex-direction:column;align-items:flex-start}}
</style></head><body>

<div class="top"><div class="top-in">
  <a class="brand" href="#" onclick="closeAll();return false"><span class="logo">K</span><span class="bt"><b id="bName">Keyima</b><span id="bSub">ICHIBAN KUJI</span></span></a>
  <div class="searchw"><input id="q" type="text" placeholder="ค้นหาคอลเลคชั่น เช่น One Piece, Dragon Ball..."></div>
  <button class="cartbtn" onclick="openCart()">🛒<span class="n" id="cartN" style="display:none">0</span></button>
  <a class="linebtn" id="lineTop" target="_blank" rel="noopener">💬 ทักไลน์</a>
</div></div>

<div class="hero">
  <h1>คอลเลคชั่น Ichiban Kuji</h1>
  <p>Ichiban Kuji ของแท้ 100% จากญี่ปุ่น · พรีออเดอร์ &amp; พร้อมส่ง</p>
  <div class="meta"><span class="tag">✓ ของแท้ 100%</span><span class="tag g" id="rateTag"></span></div>
</div>

<div class="bar">
  <span class="cnt" id="cnt"></span>
  <div class="right">เรียงตาม
    <select id="sortsel">
      <option value="new">มาใหม่</option>
      <option value="priceup">ราคาน้อย→มาก</option>
      <option value="pricedown">ราคามาก→น้อย</option>
      <option value="name">ชื่อ A-Z</option>
    </select>
  </div>
</div>

<div class="wrap"><div id="app"></div></div>

<!-- overlays -->
<div class="ov" id="ov" onclick="closeAll()"></div>

<div class="sheet" id="sheet">
  <button class="x" onclick="closeSheet()">✕</button>
  <div id="mhead" class="mhead"></div>
  <div class="mbody"><div class="mt">🎯 เลือกรางวัล + จำนวน</div><div id="pgrid" class="pgrid"></div></div>
</div>

<div class="drawer" id="drawer">
  <div class="dh"><b id="drawerTitle">🛒 ตะกร้าของคุณ</b><button class="dclose" onclick="closeCart()">✕</button></div>
  <div class="ditems" id="ditems"></div>
  <div class="dfoot" id="dfoot"></div>
</div>

<a class="floatline" id="lineFloat" target="_blank" rel="noopener">💬 สอบถาม/สั่งซื้อทางไลน์</a>
<div class="foot" id="foot"></div>
<div id="toast"></div>

<script>
/* ================= ⚙️ ตั้งค่าร้าน ================= */
const CONFIG = {
  shopName:"Keyima", brandSub:"ICHIBAN KUJI",
  lineUrl:"https://line.me/R/ti/p/@YOUR_LINE_ID",   // 👈 ใส่ลิงก์ไลน์ร้าน
  useBackend:false,    // 👈 เปลี่ยนเป็น true หลัง deploy Netlify Functions → orders/stock ออนไลน์ (ก่อนหน้านั้น = โหมดเดโม localStorage)
  apiBase:"",          // "" = same-origin (Functions บนเว็บร้านเดียวกัน) · หรือใส่ URL เต็มถ้า backend คนละโดเมน
  markup:30, vat:7, ship:200, round90:true
};
/* ================================================ */

let DB=[], FX=0.206, UPDATED='';
let q='', sortMode='new', OPENID=null;
let CART={}; try{CART=JSON.parse(localStorage.getItem('keyima_cart')||'{}')}catch(e){}
let STOCK={}; try{STOCK=JSON.parse(localStorage.getItem('keyima_stock')||'{}')}catch(e){}
const saveCart=()=>localStorage.setItem('keyima_cart',JSON.stringify(CART));
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const baht=n=>'฿'+Math.round(n).toLocaleString('en-US');
const key=(cid,pz)=>cid+'|'+pz;

/* ---- pricing (สูตรราคาขายเอง) ---- */
function round90(n){if(!CONFIG.round90)return Math.round(n);if(!isFinite(n)||n<=0)return 0;return Math.ceil(n/100)*100-10;}
function costTH(z){return z.jp*FX+CONFIG.ship;}
function sellPrice(z){const net=1-CONFIG.vat/100;return round90(costTH(z)*(1+CONFIG.markup/100)/net);}
const priced=z=>z.jp!=null;
const isOut=(cid,pz)=>STOCK[key(cid,pz)]==='out';
const soldPrizes=c=>c.prizes.filter(priced);
const colMin=c=>{let m=null;soldPrizes(c).forEach(z=>{const p=sellPrice(z);if(m==null||p<m)m=p});return m;};
const colOK=c=>soldPrizes(c).length>0 && (!q||(c.name||'').toLowerCase().includes(q));

/* ---- name helpers ---- */
function cleanName(s){
  let n=String(s||'');
  n=n.replace(/\[[^\]]*\]/g,' ');                                             // ลบ [....]
  n=n.replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2190}-\u{21FF}\u{1F1E6}-\u{1F1FF}✅✔✨]/gu,' '); // ลบ emoji/ธง
  n=n.replace(/ล็อตใหม่.*$/,'').replace(/ของแท้.*$/,'').replace(/งานฟิกเกอร์.*$/,'').replace(/ปิดฉาก.*$/,'');
  n=n.replace(/^[\s\-:|·.]+/,'').replace(/\s{2,}/g,' ').trim();
  return n||String(s||'');
}
function shortTitle(name){ // ชื่อซีรีส์สั้นๆ โชว์บนปก
  let n=cleanName(name).replace(/^(Ichiban\s*Kuji|อิจิบัง\s*คุจิ|อิจิบังคุจิ|พรีออเดอร์|พร้อมส่ง)\s*/ig,'').trim();
  n=n.split(/[·:~–\-—|(]/)[0].trim();
  return n.length>24?n.slice(0,24)+'…':n;
}
function isReady(name){return /พร้อมส่ง/.test(name);}
const GRAD=['linear-gradient(135deg,#0ea5a5,#0b7285)','linear-gradient(135deg,#e8590c,#c92a2a)','linear-gradient(135deg,#e64980,#c2255c)','linear-gradient(135deg,#7048e8,#5f3dc4)','linear-gradient(135deg,#2b8a3e,#40c057)','linear-gradient(135deg,#1c7ed6,#1864ab)','linear-gradient(135deg,#f08c00,#e67700)'];
function grad(id){let h=0;for(const c of String(id))h=(h*31+c.charCodeAt(0))>>>0;return GRAD[h%GRAD.length];}

/* ---- cart ---- */
const cartCount=()=>Object.values(CART).reduce((a,b)=>a+b,0);
function cartLines(){return Object.entries(CART).map(([k,qty])=>{const[cid,pz]=k.split('|');const c=DB.find(x=>x.id===cid);if(!c)return null;const z=c.prizes.find(p=>p.pz===pz);if(!z)return null;return{cid,pz,qty,c,z,unit:sellPrice(z)};}).filter(Boolean);}
const cartTotal=()=>cartLines().reduce((s,l)=>s+l.unit*l.qty,0);
function updCartBadge(){const n=cartCount();const e=document.getElementById('cartN');e.style.display=n?'flex':'none';e.textContent=n;}
function addToCart(cid,pz,qty){if(isOut(cid,pz)){toast('รางวัลนี้หมดแล้ว');return;}CART[key(cid,pz)]=(CART[key(cid,pz)]||0)+qty;saveCart();updCartBadge();toast('เพิ่มลงตะกร้าแล้ว ('+qty+' ชิ้น)');}
function setQty(k,qty){if(qty<=0)delete CART[k];else CART[k]=qty;saveCart();updCartBadge();renderCart();}

/* ---- toast ---- */
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2200);}

/* ---- render grid ---- */
function sortCols(v){
  if(sortMode==='priceup')v.sort((a,b)=>(colMin(a)??9e9)-(colMin(b)??9e9));
  else if(sortMode==='pricedown')v.sort((a,b)=>(colMin(b)??-1)-(colMin(a)??-1));
  else if(sortMode==='name')v.sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  else v.sort((a,b)=>{const da=a.jpDate||'',db=b.jpDate||'';if(da!==db)return db.localeCompare(da);return (a.name||'').localeCompare(b.name||'');});
  return v;
}
function render(){
  let v=sortCols(DB.filter(colOK));
  document.getElementById('cnt').textContent=v.length+' คอลเลคชั่น';
  if(!v.length){document.getElementById('app').innerHTML='<div class="empty">ไม่พบสินค้าที่ค้นหา</div>';return;}
  let h='<div class="grid">';
  v.forEach(c=>{
    const n=soldPrizes(c).length, mn=colMin(c), ready=isReady(c.name);
    const cover=c.cover?`<img src="${esc(c.cover)}" loading="lazy" onerror="this.remove()">`:'';
    h+=`<div class="card" onclick="openCol('${c.id}')">
      <div class="cov" style="background:${grad(c.id)}">${cover}
        <span class="wm">ICHIBAN KUJI</span>
        <span class="bdg ${ready?'ready':'pre'}">${ready?'พร้อมส่ง':'พรีออเดอร์'}</span>
        <div class="cvname">${esc(shortTitle(c.name))}</div></div>
      <div class="cbody">
        <div class="csub">${esc(cleanName(c.name))}</div>
        <div class="crow"><span class="pill">${n} รางวัล</span>
          <div class="pr"><div class="l">เริ่มต้น</div><div class="v">${baht(mn)}</div></div></div>
      </div></div>`;
  });
  document.getElementById('app').innerHTML=h+'</div>';
}

/* ---- prize modal ---- */
let MQ={}; // qty ที่เลือกในโมดัล
function openCol(id){
  const c=DB.find(x=>x.id===id);if(!c)return;OPENID=id;MQ={};
  const list=soldPrizes(c);
  const cover=c.cover?`<img class="mh-cov" src="${esc(c.cover)}" onerror="this.style.background='${grad(c.id)}'">`:`<div class="mh-cov" style="background:${grad(c.id)}"></div>`;
  document.getElementById('mhead').innerHTML=`${cover}<div><h2>${esc(cleanName(c.name))}</h2>
    <div class="sub">🇯🇵 Ichiban Kuji ของแท้ · ${list.length} รางวัลให้เลือก · เริ่มต้น ${baht(colMin(c))}</div></div>`;
  document.getElementById('pgrid').innerHTML=list.map(z=>{
    const img=z.img||c.cover, out=isOut(c.id,z.pz);
    const imgtag=img?`<img src="${esc(img)}" loading="lazy" onerror="this.style.opacity=0">`:'';
    return `<div class="pcard"><div class="pimg" style="background:${grad(c.id)}">${imgtag}<span class="pb">${esc(z.pz)}</span>${out?'<div class="soldout">SOLD OUT</div>':''}</div>
      <div class="pcbody"><div class="pchar">รางวัล ${esc(z.pz)}</div>
        <div class="pprice"><span class="v">${baht(sellPrice(z))}</span><span class="u">/ ชิ้น</span></div>
        ${out?'<button class="addb dim" disabled>หมดแล้ว</button>':
        `<div class="qadd"><div class="stp"><button onclick="mq('${esc(z.pz)}',-1)">−</button><span id="mq_${cssId(z.pz)}">1</span><button onclick="mq('${esc(z.pz)}',1)">+</button></div>
         <button class="addb" onclick="addFromModal('${c.id}','${esc(z.pz)}')">🛒 หยิบใส่ตะกร้า</button></div>`}
      </div></div>`;
  }).join('');
  showSheet();
}
const cssId=s=>String(s).replace(/[^a-zA-Z0-9]/g,'_');
function mq(pz,d){MQ[pz]=Math.max(1,(MQ[pz]||1)+d);const e=document.getElementById('mq_'+cssId(pz));if(e)e.textContent=MQ[pz];}
function addFromModal(cid,pz){addToCart(cid,pz,MQ[pz]||1);MQ[pz]=1;const e=document.getElementById('mq_'+cssId(pz));if(e)e.textContent=1;}

/* ---- cart drawer ---- */
function renderCart(){
  const lines=cartLines();
  document.getElementById('drawerTitle').textContent='🛒 ตะกร้า ('+cartCount()+')';
  const box=document.getElementById('ditems');
  if(!lines.length){box.innerHTML='<div class="dempty">ยังไม่มีสินค้าในตะกร้า<br>เลือกรางวัลที่ต้องการก่อนนะ 🎁</div>';document.getElementById('dfoot').innerHTML='';return;}
  box.innerHTML=lines.map(l=>{const img=l.z.img||l.c.cover;const k=key(l.cid,l.pz);
    return `<div class="ci"><img src="${esc(img)}" onerror="this.style.background='${grad(l.cid)}'">
      <div class="cinfo"><div class="cn">${esc(cleanName(l.c.name))} · รางวัล ${esc(l.pz)}</div>
        <div class="cp">${baht(l.unit)} × ${l.qty} = ${baht(l.unit*l.qty)}</div>
        <div class="cctl"><div class="stp"><button onclick="setQty('${k}',${l.qty-1})">−</button><span>${l.qty}</span><button onclick="setQty('${k}',${l.qty+1})">+</button></div>
        <button class="rm" onclick="setQty('${k}',0)">ลบ</button></div></div></div>`;
  }).join('');
  document.getElementById('dfoot').innerHTML=`<div class="dtot"><span style="font-weight:800">ยอดรวม</span><b>${baht(cartTotal())}</b></div>
    <button class="cob" onclick="openCheckout()">สั่งซื้อ →</button>`;
}
function openCart(){renderCart();document.getElementById('ov').classList.add('show');document.getElementById('drawer').classList.add('show');}
function closeCart(){document.getElementById('drawer').classList.remove('show');if(!document.getElementById('sheet').classList.contains('show'))document.getElementById('ov').classList.remove('show');}

/* ---- checkout + order ---- */
function openCheckout(){
  const lines=cartLines();if(!lines.length){toast('ตะกร้าว่าง');return;}
  document.getElementById('mhead').style.display='none';
  document.getElementById('sheet').querySelector('.mbody').innerHTML=`
    <div class="mt" style="font-size:16px;color:var(--ink)">📦 กรอกข้อมูลจัดส่ง</div>
    <div style="background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px">
      ${lines.map(l=>`<div style="display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0"><span>${esc(cleanName(l.c.name))} · ${esc(l.pz)} ×${l.qty}</span><b>${baht(l.unit*l.qty)}</b></div>`).join('')}
      <div style="display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-weight:900"><span>ยอดรวม</span><span style="color:var(--accent)">${baht(cartTotal())}</span></div>
    </div>
    <div class="form">
      <label>ชื่อผู้สั่ง *</label><input id="f_name" placeholder="ชื่อ-นามสกุล">
      <label>เบอร์โทร / ไลน์ *</label><input id="f_contact" placeholder="0xx-xxx-xxxx หรือ Line ID">
      <label>ที่อยู่จัดส่ง</label><textarea id="f_addr" placeholder="บ้านเลขที่ / ถนน / ตำบล / อำเภอ / จังหวัด / รหัสไปรษณีย์"></textarea>
      <label>หมายเหตุ</label><input id="f_note" placeholder="เช่น โอนมัดจำก่อน / รับเอง ฯลฯ">
    </div>
    <button class="cob" style="margin-top:16px" onclick="submitOrder()">✓ ยืนยันสั่งซื้อ</button>
    <button class="dclose" style="width:100%;height:44px;margin-top:8px;border-radius:12px" onclick="openCart()">← กลับไปตะกร้า</button>`;
  closeCart();showSheet();
}
async function submitOrder(){
  const name=(document.getElementById('f_name').value||'').trim();
  const contact=(document.getElementById('f_contact').value||'').trim();
  if(!name||!contact){toast('กรุณากรอกชื่อ + เบอร์/ไลน์');return;}
  const lines=cartLines();
  const order={items:lines.map(l=>({cid:l.cid,pz:l.pz,qty:l.qty,price:l.unit,name:cleanName(l.c.name)})),
    customer:{name,contact,address:(document.getElementById('f_addr').value||'').trim(),note:(document.getElementById('f_note').value||'').trim()},
    total:cartTotal()};
  let orderId;
  if(CONFIG.useBackend){
    try{const r=await fetch(CONFIG.apiBase.replace(/\/$/,'')+'/api/orders',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(order)});if(!r.ok)throw 0;const j=await r.json();orderId=j.orderId||j.id;}catch(e){toast('ส่งออเดอร์ไม่สำเร็จ ลองใหม่');return;}
  }else{ // โหมด localStorage (เดโม)
    let orders=[];try{orders=JSON.parse(localStorage.getItem('keyima_orders')||'[]')}catch(e){}
    orderId='KYM-'+String(Date.now()).slice(-6);
    orders.push({id:orderId,created:new Date().toISOString(),status:'new',...order});
    localStorage.setItem('keyima_orders',JSON.stringify(orders));
  }
  showSuccess(orderId,order);
  CART={};saveCart();updCartBadge();
}
function showSuccess(orderId,order){
  const msg='🛒 สั่งซื้อ #'+orderId+'\n'+order.items.map(i=>'▪️ '+i.name+' · '+i.pz+' ×'+i.qty+' = '+baht(i.price*i.qty)).join('\n')+'\n💰 รวม '+baht(order.total)+'\n👤 '+order.customer.name+' · '+order.customer.contact;
  window.__lastOrderMsg=msg;
  document.getElementById('mhead').style.display='none';
  document.getElementById('sheet').querySelector('.mbody').innerHTML=`
    <div class="success"><div class="ok">✓</div>
      <h3>รับออเดอร์แล้ว!</h3>
      <div class="ordno">#${orderId}</div>
      <p style="color:var(--ink2);font-size:13.5px">กรุณาทักไลน์เพื่อยืนยัน + แจ้งชำระเงิน<br>(ก๊อปรายการออเดอร์ให้แล้ว วางในแชทได้เลย)</p>
      <button class="cob" style="background:var(--line-green);margin-top:18px" onclick="copyOrder();window.open(CONFIG.lineUrl,'_blank','noopener')">💬 ทักไลน์ยืนยันออเดอร์</button>
      <button class="dclose" style="width:100%;height:44px;margin-top:8px;border-radius:12px" onclick="closeSheet();render()">เลือกซื้อต่อ</button>
    </div>`;
  showSheet();
}
function copyOrder(){if(navigator.clipboard&&window.__lastOrderMsg)navigator.clipboard.writeText(window.__lastOrderMsg).catch(()=>{});toast('ก๊อปรายการออเดอร์แล้ว');}

/* ---- overlay helpers ---- */
function showSheet(){document.getElementById('ov').classList.add('show');document.getElementById('sheet').classList.add('show');document.body.style.overflow='hidden';}
function closeSheet(){document.getElementById('sheet').classList.remove('show');document.getElementById('ov').classList.remove('show');document.body.style.overflow='';
  document.getElementById('mhead').style.display='';
  document.getElementById('sheet').querySelector('.mbody').innerHTML='<div class="mt">🎯 เลือกรางวัล + จำนวน</div><div id="pgrid" class="pgrid"></div>';}
function closeAll(){closeSheet();document.getElementById('drawer').classList.remove('show');}

document.getElementById('q').addEventListener('input',e=>{q=e.target.value.toLowerCase().trim();render();});
document.getElementById('sortsel').addEventListener('change',e=>{sortMode=e.target.value;render();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAll();});

function applyConfig(){
  document.getElementById('bName').textContent=CONFIG.shopName;
  document.getElementById('bSub').textContent=CONFIG.brandSub;
  document.title=CONFIG.shopName+' — Ichiban Kuji ของแท้จากญี่ปุ่น';
  document.getElementById('lineTop').href=CONFIG.lineUrl;
  document.getElementById('lineFloat').href=CONFIG.lineUrl;
}
applyConfig();updCartBadge();
fetch('data.json?t='+Date.now()).then(r=>r.json()).then(async d=>{
  FX=d.rate||0.206;DB=d.collections||[];UPDATED=d.updated||'';
  if(CONFIG.useBackend){try{STOCK=(await fetch(CONFIG.apiBase.replace(/\/$/,'')+'/api/stock').then(r=>r.json()))||{};}catch(e){}}
  document.getElementById('rateTag').textContent='เรต ¥1 = ฿'+FX+' · อัปเดต '+(UPDATED||'-');
  const items=DB.reduce((s,c)=>s+soldPrizes(c).length,0);
  document.getElementById('foot').innerHTML=CONFIG.shopName+' · '+DB.filter(colOK).length+' คอลเลคชั่น · '+items+' รายการพร้อมขาย · ราคารวมค่าส่งจากญี่ปุ่นแล้ว<br>ราคาอาจเปลี่ยนตามเรตเงินเยน — ยืนยันราคาก่อนสั่งได้ที่ไลน์';
  render();
}).catch(()=>{document.getElementById('app').innerHTML='<div class="empty">โหลดข้อมูลสินค้าไม่ได้ (ต้อง deploy พร้อม data.json)</div>';});
</script></body></html>
